name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DeadShotGames for iOS
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned iOS app
        run: |
          xcodebuild -project DeadShotGames.xcodeproj -scheme DeadShotGames -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package unsigned IPA
        run: |
          rm -rf Payload DeadShotGames.ipa
          mkdir -p Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/DeadShotGames.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload DeadShotGames.ipa
          rm -rf Payload
          ls -lh DeadShotGames.ipa

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeadShotGames-unsigned
          path: DeadShotGames.ipa
          if-no-files-found: error
          retention-days: 14
