name: iOS CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Validate SwiftUI Project
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'

    - name: Verify Swift Files & Syntax
      run: |
        swift --version || echo "Swift CLI check"
        find DeadShotGames -name "*.swift" -print
