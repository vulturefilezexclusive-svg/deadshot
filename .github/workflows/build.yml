name: iOS CI & IPA Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Generate IPA Artifact
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Run Build Script
      run: ./build-ipa.sh

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DeadShotGames-Build-Artifacts
        path: |
          DeadShotGames/
          README.md
          build-ipa.sh
