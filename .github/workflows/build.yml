name: iOS CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Validate SwiftUI Project
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Check Swift & Xcode Version
      run: |
        swift --version
        xcodebuild -version

    - name: Validate Swift Source Files
      run: |
        find DeadShotGames -name "*.swift" -print
        swiftc -v || true
